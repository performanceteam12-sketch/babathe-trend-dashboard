name: Remote refresh watcher

# 배포된 대시보드의 "새로고침 요청 보내기" 버튼은 GitHub API로 data/refresh_signal.json을
# 커밋하는 것까지만 한다(Streamlit Cloud에는 Playwright가 없어 직접 스크래핑이 불가능하기 때문).
# 원래는 사용자 로컬 PC가 5분마다 이 파일을 확인해 실제 스크래핑을 수행했는데, PC 화면이
# 잠긴 상태에서는 Windows 작업 스케줄러가 Playwright를 실행하지 못해(대시보드 깨우기 작업과
# 동일한 원인, 오류 0x800710E0) 요청이 계속 무시되는 문제가 있었다 (2026-08-06 발견).
# PC 상태와 무관하게 항상 처리되도록 이 감시도 GitHub Actions로 옮긴다.
#
# **2026-09-04: 5분 cron 트리거 제거**. dashboard/app.py가 신호 파일을 커밋한 직후 이 워크플로를
# workflow_dispatch로 직접 즉시 트리거하므로 주기적 폴링이 원래 불필요했는데, 5분 cron까지 같이
# 켜져 있던 탓에 버그가 하나 겹쳤다: git_sync.py의 push에 재시도 로직이 없어서, 이 워크플로의
# 실행이 겹치는 등의 이유로 "신호 파일 삭제" 커밋의 푸시가 실패하면 신호가 원격에서 안 사라진
# 채로 남았다. 그러면 5분 뒤 다음 cron 실행이 같은 신호를 "아직 대기 중"으로 다시 보고 재처리하는
# 게 반복돼, 몇 주간 naver/app_search 새로고침이 (실제 버튼 클릭은 14번뿐인데) 수백 번 중복
# 처리됐다 — robots.txt로 막힌 사이트에 저빈도 원칙보다 훨씬 잦은 요청이 갔다. git_sync.py는
# push 실패 시 pull --rebase 후 재시도하도록 고쳤지만(재발 방지), 애초에 상시 폴링 자체가
# 저빈도 원칙과 맞지 않아 cron은 완전히 없앴다 — 이제 오직 사용자가 버튼을 눌렀을 때(즉시
# workflow_dispatch)만 실행된다.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process pending refresh request (if any)
        run: python scraper/remote_refresh_watcher.py
