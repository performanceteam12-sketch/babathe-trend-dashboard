name: Remote refresh watcher

# 배포된 대시보드의 "새로고침 요청 보내기" 버튼은 GitHub API로 data/refresh_signal.json을
# 커밋하는 것까지만 한다(Streamlit Cloud에는 Playwright가 없어 직접 스크래핑이 불가능하기 때문).
# 원래는 사용자 로컬 PC가 5분마다 이 파일을 확인해 실제 스크래핑을 수행했는데, PC 화면이
# 잠긴 상태에서는 Windows 작업 스케줄러가 Playwright를 실행하지 못해(대시보드 깨우기 작업과
# 동일한 원인, 오류 0x800710E0) 요청이 계속 무시되는 문제가 있었다 (2026-08-06 발견).
# PC 상태와 무관하게 항상 처리되도록 이 감시도 GitHub Actions로 옮긴다.
#
# 5분마다 도는 건 "신호 파일이 있는지 GitHub 저장소를 확인"하는 것뿐 — 신호가 없으면 곧바로
# 종료하고 네이버/더한섬닷컴 등 실제 사이트에는 아무 요청도 가지 않는다. 즉 "사용자가 명시적으로
# 요청했을 때만 스크래핑한다"는 저빈도 원칙은 그대로 유지된다.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process pending refresh request (if any)
        run: python scraper/remote_refresh_watcher.py
